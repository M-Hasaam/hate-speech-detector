<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Retired</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f0c1b;
      color: #f3f4f6;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      padding: 32px;
      border-radius: 20px;
      background: rgba(25, 20, 38, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sandbox retired</h1>
    <p>The old local logistic model has been removed. Use <strong>terminal_chatbot.js</strong> with <strong>HF_TOKEN</strong> for BERT-only checks.</p>
  </div>
</body>
</html>
