<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Guard Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090611 0%, #130a1c 50%, #050409 100%);
      --card-bg: rgba(25, 20, 38, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #9d4edd;
      --primary-glow: rgba(157, 78, 221, 0.35);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      width: 320px;
      height: auto;
      padding: 1.25rem;
      overflow: hidden;
      border: 1px solid rgba(157, 78, 221, 0.15);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .shield-icon {
      font-size: 1.5rem;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 2px var(--primary-glow)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 10px rgba(157, 78, 221, 0.65)); transform: scale(1.05); }
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(to right, #e0aaff, #c77dff, #9d4edd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* Switch styling */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #d1d5db;
      transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
      border-color: rgba(157, 78, 221, 0.4);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: white;
    }

    /* Stats Grid */
    .stats-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .stat-card:hover {
      border-color: rgba(157, 78, 221, 0.2);
    }

    .stat-card.full-width {
      grid-column: span 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      padding: 0.6rem 1rem;
    }

    .stat-num {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
    }

    .stat-card.full-width .stat-num {
      margin-bottom: 0;
      font-size: 1.4rem;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Colors for stats */
    .color-checked { color: #e0aaff; }
    .color-hate { color: #fca5a5; }
    .color-off { color: #fde047; }

    /* Button */
    .btn {
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(157, 78, 221, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(157, 78, 221, 0.55);
    }

    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <span class="shield-icon">🛡️</span>
      <h1>Social Guard</h1>
    </div>
    
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="globalToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <main>
    <div class="stats-title">Protection Statistics</div>
    <div class="stats-grid">
      <!-- Checked items -->
      <div class="stat-card full-width">
        <span class="stat-label">Comments Analyzed</span>
        <span class="stat-num color-checked" id="statTotal">0</span>
      </div>
      
      <!-- Hate Speech blocked -->
      <div class="stat-card">
        <div class="stat-num color-hate" id="statHate">0</div>
        <div class="stat-label">Hate Speech Blocked</div>
      </div>
      
      <!-- Offensive blocked -->
      <div class="stat-card">
        <div class="stat-num color-off" id="statOffensive">0</div>
        <div class="stat-label">Offensive Blocked</div>
      </div>
    </div>

    <button id="optionsBtn" class="btn">
      ⚙️ Open Options Settings
    </button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
